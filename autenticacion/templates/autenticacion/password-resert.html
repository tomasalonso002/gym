{% extends 'usuarios/base.html' %}

{% block body %}

<div class="max-w-md mx-auto mt-16 bg-white shadow-xl rounded-2xl p-8 border border-gray-100">
    
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">
            Recuperar contraseña
        </h2>
        <p class="mt-3 text-gray-600">
            Ingresá el correo electrónico asociado a tu cuenta y te enviaremos
            un enlace para restablecer tu contraseña.
        </p>
    </div>
    
    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            {{ form.as_p }}
        </div>
        
        <button
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition duration-200"
        >
        Enviar enlace de recuperación
    </button>
</form>

</div>

{% endblock %}
