services:
  web:
    build: .
    container_name: gym_web
    command: ./entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: gym_db
    restart: always
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  static_volume:
  media_volume: