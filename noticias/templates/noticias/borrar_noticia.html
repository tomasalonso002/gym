{% extends 'usuarios/base.html' %}

{% block body %}

<div class="max-w-2xl mx-auto mt-12">

    <div class="bg-white rounded-2xl shadow-xl border border-red-200 overflow-hidden">

        <!-- Encabezado -->
        <div class="bg-red-50 border-b border-red-200 p-6">
            <h1 class="text-3xl font-bold text-red-600">
                Eliminar noticia
            </h1>
            <p class="text-gray-600 mt-2">
                Esta acción eliminará la noticia de forma permanente y no podrá recuperarse.
            </p>
        </div>

        <!-- Información -->
        <div class="p-6 space-y-6">

            <div class="space-y-6">

                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">
                        Título
                    </h2>
                    
                    <div class="rounded-lg border border-gray-200 bg-gray-50 p-4 break-words">
                        {{ noticia.titulo }}
                    </div>
                </div>
                {% if noticia.contenido %}
                    <div>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">
                            Contenido
                        </h2>

                        <div class="rounded-lg border border-gray-200 bg-gray-50 p-4 whitespace-pre-wrap break-words max-h-64 overflow-y-auto">
                            {{ noticia.contenido }}
                        </div>
                    </div>
                {% endif %}

            </div>

            <!-- Botones -->
            <form method="POST">
                {% csrf_token %}

                <div class="flex flex-col sm:flex-row gap-4 px-3 pt-4">

                    <button
                        type="submit"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition cursor-pointer"
                    >
                        Eliminar noticia
                    </button>

                    <a
                        href="{% url 'noticias' %}"
                        class="flex-1 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold transition border"
                    >
                        Cancelar
                    </a>

                </div>
            </form>

        </div>

    </div>

</div>

{% endblock %}
