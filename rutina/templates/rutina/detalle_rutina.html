{% extends 'usuarios/base.html' %}
{% load widget_tweaks %}

{% block body %}

<div class="max-w-6xl mx-auto mt-8">

    <!-- Encabezado -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

            <div>
                <h1 class="text-4xl font-bold text-gray-800">
                    {{ rutina.nombre }}
                </h1>

                <p class="text-gray-500 mt-2">
                    Visualización de la rutina personalizada.
                </p>
            </div>

            <a href="{% url 'perfil' user.id %}"
               class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-lg shadow transition text-center">
                ← Volver
            </a>

        </div>

    </div>

    <!-- Rutina -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        {% if rutina.archivo %}

            <div class="bg-gray-100 p-6">

                <img
                    src="{{ rutina.archivo.url }}"
                    alt="{{ rutina.nombre }}"
                    class="w-full max-h-[80vh] object-contain rounded-xl"
                >

            </div>

        {% else %}

            <div class="p-12 text-center">

                <div class="text-6xl mb-5">
                    🏋️
                </div>

                <h2 class="text-2xl font-bold text-gray-700">
                    Esta rutina no tiene imagen
                </h2>

                <p class="text-gray-500 mt-3">
                    Cuando se cargue una imagen aparecerá aquí.
                </p>

            </div>

        {% endif %}

    </div>

</div>

{% endblock %}
